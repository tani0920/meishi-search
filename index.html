<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名刺検索</title>
<meta name="apple-mobile-web-app-title" content="名刺検索">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b65cd">
<script>
// ?setup 付きで開いたときだけ移動せずに止まる（ホーム画面に追加するため）。
// 追加されるURLから ?setup を消しておくので、ホーム画面から開くと通常どおり移動する。
var SETUP = /[?&]setup/.test(location.search);
if (SETUP) history.replaceState(null, '', location.pathname);
else location.replace('https://script.google.com/macros/s/AKfycbxslC2XXVvqFm-tw74vY1FR638Bfw1yxqdJqwSLHjH9lfAsZ28Obhd-wfExrPIDIYbp4g/exec');
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f9; color: #687085;
         font-family: "Hiragino Sans", system-ui, sans-serif; font-size: 14px; }
  a { color: #2b4c8c; }
</style>
</head>
<body>
<p id="go">名刺検索を開いています… <a href="https://script.google.com/macros/s/AKfycbxslC2XXVvqFm-tw74vY1FR638Bfw1yxqdJqwSLHjH9lfAsZ28Obhd-wfExrPIDIYbp4g/exec">開かないときはこちら</a></p>
<div id="setup" hidden style="max-width:20em;line-height:1.8;padding:0 16px">
  <img src="apple-touch-icon.png" width="72" height="72" alt="" style="border-radius:16px;display:block;margin:0 auto 12px">
  <p>このページをホーム画面に追加してください。</p>
  <p>Chrome：右上の共有ボタン →「ホーム画面に追加」<br>Safari：下の共有ボタン →「ホーム画面に追加」</p>
  <p>追加したアイコンから開くと、名刺検索に移動します。</p>
</div>
<script>if (SETUP) { document.getElementById('go').hidden = true; document.getElementById('setup').hidden = false; }</script>
</body>
</html>
